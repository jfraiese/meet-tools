<!doctype html>
<meta charset="utf-8">
<title>Meet Recorder — setup</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1.5rem; }
  h1 { font-size: 1.3rem; }
  button { font: inherit; padding: .5rem 1rem; border-radius: .4rem; border: 1px solid #888; background: #fff; cursor: pointer; }
  #status { margin-top: 1.5rem; padding: .75rem 1rem; border-radius: .4rem; background: #f2f2f2; }
  .ok { background: #e6f4ea !important; }
  .bad { background: #fce8e6 !important; }
</style>
<h1>One-time setup</h1>
<p>
  Meet Recorder needs microphone access to record your side of a call. Chrome
  only allows that permission to be asked for from a real tab, which is why
  this page exists — it runs once.
</p>
<p><button id="grant">Grant microphone access</button></p>
<div id="status">Not granted yet.</div>
<script type="module" src="setup.js"></script>
